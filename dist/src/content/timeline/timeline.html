<!-- Root container (fixed left rail) -->
<div id="gpt-notes-tl" class="gpt-notes-tl" data-mounted="0">
    <div class="gpt-notes-tl__panel">
      <div class="gpt-notes-tl__railwrap">
        <!-- Scrollable viewport -->
        <div class="gpt-notes-tl__scroll">
          <!-- Virtual canvas (height is set dynamically) -->
          <div class="gpt-notes-tl__canvas">
            <div class="gpt-notes-tl__rail"></div>
            <!-- dots & bookmark markers are injected here -->
          </div>
        </div>
        <!-- Hit area for scrub (click/drag on the rail area) -->
        <div class="gpt-notes-tl__hit" title="Drag to scrub the timeline"></div>
      </div>
    </div>
  </div>
  
  <!-- Tooltip lives outside so it can overlap page content freely -->
  <div id="gpt-notes-tl-tip" class="gpt-notes-tl__tip" style="display:none"></div>
